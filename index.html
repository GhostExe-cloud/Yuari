        // Modal logic
        var modal = document.getElementById('modal');

        function openModal() {

        }

        function closeModal() {
            modal.classList.remove('open');
        }

        function closeModalOnOverlay(e) {
            if (e.target === modal) closeModal();
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });

        // Preview tilt effect (unchanged)
        var previewContainer = document.getElementById('previewContainer');
        var previewWrapper = document.getElementById('previewWrapper');
        var previewGlow = document.getElementById('previewGlow');
        var previewShine = document.getElementById('previewShine');

        var bounds = null;
        var currentX = 0;
        var currentY = 0;
        var targetX = 0;
        var targetY = 0;
        var rafId = null;

        function updateBounds() {
            bounds = previewContainer.getBoundingClientRect();
        }

        function handleMouseMove(e) {
            if (!bounds) updateBounds();

            var relX = (e.clientX - bounds.left) / bounds.width;
            var relY = (e.clientY - bounds.top) / bounds.height;

            var maxTilt = 8;
            targetY = (relX - 0.5) * maxTilt;
            targetX = (0.5 - relY) * maxTilt;

            var glowX = relX * 100;
            var glowY = relY * 100;
            previewGlow.style.background = 'radial-gradient(circle at ' + glowX + '% ' + glowY + '%, rgba(255, 255, 255, 1), transparent 20%)';

            previewShine.style.background = 'linear-gradient(' + (135 + (relX - 0.5) * 60) + 'deg, rgba(255,255,255,' + (0.08 + relY * 0.05) + ') 0%, transparent 50%)';

            if (!rafId) {
                rafId = requestAnimationFrame(animate);
            }
        }

        function animate() {
            currentX += (targetX - currentX) * 0.12;
            currentY += (targetY - currentY) * 0.12;

            var depth = Math.sqrt(currentX * currentX + currentY * currentY);
            var translateZ = depth * 1.5;

            previewWrapper.style.transform =
                'perspective(1000px) rotateX(' + currentX + 'deg) rotateY(' + currentY + 'deg) translateZ(' + translateZ + 'px)';

            if (Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01) {
                rafId = requestAnimationFrame(animate);
            } else {
                rafId = null;
            }
        }

        function handleMouseLeave() {
            targetX = 0;
            targetY = 0;
            previewGlow.style.background = 'radial-gradient(circle at center, rgba(120, 130, 255, 0.15), transparent 70%)';
            previewShine.style.background = 'transparent';

            if (!rafId) {
                rafId = requestAnimationFrame(animate);
            }
        }

        previewContainer.addEventListener('mousemove', handleMouseMove);
        previewContainer.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('resize', updateBounds);
        window.addEventListener('scroll', updateBounds);
